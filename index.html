<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fignal Platinum — curated trading signals for members." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238a8a86' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M4 17v3M9 11v9M14 7v13M19 3v17'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Fignal — Platinum Signals</title>
    <script>
      // Dark is the default theme. Apply the persisted choice before first
      // paint so there is never a flash of the wrong theme.
      (function () {
        try {
          var theme = localStorage.getItem("fignal-theme");
          document.documentElement.classList.toggle("dark", theme !== "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
